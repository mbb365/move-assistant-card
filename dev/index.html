<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Move Assistant dev</title>
<style>body{margin:0;background:#111}html{scrollbar-width:none}html::-webkit-scrollbar{display:none}</style>
</head>
<body>
<move-assistant-card></move-assistant-card>
<script type="module">
// Fake Home Assistant so the card can be previewed without a real instance.
// Saved data lives in this browser's localStorage under "ma-dev".
import "../src/move-assistant-card.js";

const listeners = [];
// ?demo=1 keeps its own copy, so the made-up weeks never land in your dev data
const SLOT = new URLSearchParams(location.search).get("demo") === "1" ? "ma-dev:demo" : "ma-dev";
const read = () => { try { return JSON.parse(localStorage.getItem(SLOT)); } catch { return null; } };
const states = {
  "sensor.pixel_daily_steps": { entity_id: "sensor.pixel_daily_steps", state: "6840", attributes: { friendly_name: "Pixel Daily steps", unit_of_measurement: "steps" } },
  "sensor.matts_iphone_health_steps": { entity_id: "sensor.matts_iphone_health_steps", state: "8212", attributes: { friendly_name: "Matt's iPhone Health steps", unit_of_measurement: "steps" } },
  "sensor.living_room_temperature": { entity_id: "sensor.living_room_temperature", state: "21.4", attributes: { friendly_name: "Living room temperature", unit_of_measurement: "°C" } },
  "light.living_room_ceiling": { entity_id: "light.living_room_ceiling", state: "on", attributes: { friendly_name: "Living room ceiling", supported_color_modes: ["color_temp", "hs"], color_mode: "color_temp", brightness: 180, color_temp_kelvin: 2700 } },
  "light.living_room_strip": { entity_id: "light.living_room_strip", state: "off", attributes: { friendly_name: "Living room strip", supported_color_modes: ["rgb"] } },
  "light.living_room_lamp": { entity_id: "light.living_room_lamp", state: "on", attributes: { friendly_name: "Living room lamp", supported_color_modes: ["brightness"], color_mode: "brightness", brightness: 120 } },
  "light.bedroom_ceiling": { entity_id: "light.bedroom_ceiling", state: "off", attributes: { friendly_name: "Bedroom ceiling", supported_color_modes: ["hs", "color_temp"] } },
  "light.garage": { entity_id: "light.garage", state: "off", attributes: { friendly_name: "Garage", supported_color_modes: ["onoff"] } },
  "weather.forecast_home": { entity_id: "weather.forecast_home", state: "sunny", attributes: { friendly_name: "Forecast Amsterdam", temperature: 26, temperature_unit: "°C" } },
};
// A week of fake daily forecast, starting today
const fakeForecast = () => {
  const now = new Date();
  const days = [["sunny", 26, 15], ["cloudy", 22, 10], ["rainy", 19, 8], ["partlycloudy", 20, 13], ["sunny", 21, 17], ["partlycloudy", 21, 16], ["snowy", 3, -2]];
  return days.map(([condition, temperature, templow], i) => ({ datetime: new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, 12).toISOString(), condition, temperature, templow }));
};
// Six days of fake hourly forecast from this hour, for the 12-hour sky and the bigger view
const fakeHourly = () => {
  const now = new Date(), start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours());
  const days = fakeForecast();
  const nights = ["clear-night", "cloudy", "rainy", "clear-night", "partlycloudy", "rainy", "snowy"];
  return [...Array(144)].map((_, i) => {
    const t = new Date(+start + i * 3600e3), h = t.getHours();
    const di = Math.round((new Date(t.getFullYear(), t.getMonth(), t.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
    const day = days[Math.min(di, days.length - 1)], night = h < 6 || h >= 18;
    let condition = night ? nights[Math.min(h < 6 ? Math.max(0, di - 1) : di, nights.length - 1)] : day.condition;
    if (di === 3 && h >= 14 && h <= 16) condition = "rainy"; // an afternoon shower
    const temperature = Math.round((day.templow + (day.temperature - day.templow) * (0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, (h - 5) / 10))) * (h > 15 ? Math.max(0, 1 - (h - 15) / 14) : 1))) * 10) / 10;
    return { datetime: t.toISOString(), condition, temperature };
  });
};
const params = new URLSearchParams(location.search);
// ?demo=1: 30 days of made-up moves and check-ins, and the iPhone's step sensor picked, so Activity and Movement
// have weeks to show
const demoData = (saved) => {
  const v = saved || {}, now = new Date(), day = (i) => new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
  const key = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const r = (i, n) => ((i + 1) * 2654435761 + n * 40503) % 1000 / 1000;
  const history = [], checkins = [];
  for (let i = 29; i >= 0; i--) {
    const d = day(i);
    if (r(i, 1) < 0.6) history.unshift({ id: "h-demo-" + i, move_id: "kettlebell", name: "Kettlebell full body", start: new Date(+d + 7.5 * 3600e3).toISOString(), seconds: Math.round((10 + r(i, 2) * 25) * 60), completed: true });
    ["morning", "evening"].forEach((slot, s) => {
      if (i === 0 && slot === "evening") return;
      checkins.unshift({ date: key(d), slot, mood: Math.round(35 + r(i, 3 + s) * 60), energy: Math.round(30 + r(i, 5 + s) * 65), scale: 100, at: new Date(+d + (s ? 19 : 8) * 3600e3).toISOString() });
    });
  }
  return { ...v, history, checkins, settings: { ...(v.settings || {}), entities: { ...(v.settings?.entities || {}), steps: "sensor.matts_iphone_health_steps" } } };
};
const hass = {
  states,
  callWS: async (msg) => {
    if (msg.type === "frontend/get_user_data") return { value: params.get("demo") === "1" ? demoData(read()) : read() };
    if (msg.type === "frontend/set_user_data") {
      localStorage.setItem(SLOT, JSON.stringify(msg.value));
      listeners.forEach((cb) => cb({ value: msg.value }));
      return null;
    }
    if (msg.type === "recorder/statistics_during_period") {
      // 30 days of fake step totals
      const id = msg.statistic_ids[0];
      const start = new Date(msg.start_time);
      const rows = [...Array(30)].map((_, i) => ({ start: new Date(start.getFullYear(), start.getMonth(), start.getDate() + i).getTime(), max: 3000 + ((i * 2654435761) % 9000) }));
      return { [id]: rows };
    }
    if (msg.type === "fire_event") { console.log("event", msg.event_data); return null; }
    throw new Error("unknown " + msg.type);
  },
  // Fake lights in two rooms; each light call is logged to window.__services and the console
  areas: { living_room: { area_id: "living_room", name: "Living room" }, bedroom: { area_id: "bedroom", name: "Bedroom" } },
  entities: { "light.living_room_ceiling": { area_id: "living_room" }, "light.living_room_strip": { area_id: "living_room" }, "light.living_room_lamp": { area_id: "living_room" }, "light.bedroom_ceiling": { area_id: "bedroom" } },
  devices: {},
  callService: async (domain, service, data) => {
    (window.__services ||= []).push({ at: Date.now(), domain, service, data });
    console.log("service", domain + "." + service, JSON.stringify(data));
    return {};
  },
  services: { notify: { mobile_app_matts_iphone: {}, persistent_notification: {} } },
  callApi: async (method, path, data) => { console.log("api", method, path, data); window.__api = { method, path, data }; return {}; },
  connection: {
    subscribeMessage: async (cb, msg) => {
      if (msg?.type === "weather/subscribe_forecast") {
        if (msg.forecast_type === "hourly") { setTimeout(() => cb({ type: "hourly", forecast: fakeHourly() }), 250); return () => {}; }
        if (msg.forecast_type !== "daily") throw new Error("forecast type not supported");
        setTimeout(() => cb({ type: "daily", forecast: fakeForecast() }), 150); return () => {};
      }
      listeners.push(cb); return () => {};
    },
  },
};
const card = document.querySelector("move-assistant-card");
card.setConfig({});
card.hass = hass;
window.__fakeHass = hass;

// ?nopop=1 skips the check-in popup.
const waitForApp = () => new Promise((resolve) => {
  const tick = () => card.shadowRoot?.getElementById("app")?.style.opacity === "" ? resolve() : setTimeout(tick, 50);
  tick();
});
waitForApp().then(() => {
  if (params.get("nopop") === "1") {
    setTimeout(() => card.shadowRoot.getElementById("checkinModal").classList.remove("open"), 900);
  }
});
</script>
</body>
</html>
